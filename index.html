<style>
  :root{
    --ink:#1c2321;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#e2ddd0;
    --accent:#1e4d3f;
    --accent-soft:#e4efe9;
    --gold:#b8863f;
    --muted:#7a7468;
    --done:#9aa89f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia','Times New Roman',serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:80px;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:2px solid var(--ink);
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.5rem;
    letter-spacing:0.02em;
  }
  header p{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.8rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .sync-status{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:0.72rem;
    margin-top:8px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--muted);
  }
  .sync-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--muted);
  }
  .sync-dot.ok{background:var(--accent);}
  .sync-dot.err{background:#b0403a;}
  .progress-wrap{
    margin-top:14px;
  }
  .progress-track{
    height:6px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    margin-top:6px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.78rem;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:12px 20px;
    background:var(--paper);
    position:sticky;
    top:96px;
    z-index:9;
    border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.75rem;
    letter-spacing:0.03em;
    padding:8px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--card);
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  main{
    padding:16px 20px 40px;
    max-width:640px;
    margin:0 auto;
  }
  .section{
    margin-bottom:28px;
  }
  .section-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--ink);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .section-title h2{
    margin:0;
    font-size:1.05rem;
    letter-spacing:0.03em;
  }
  .section-count{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.72rem;
    color:var(--muted);
  }
  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
    -webkit-tap-highlight-color:transparent;
  }
  .item:active{background:var(--accent-soft);}
  .cb-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    flex:0 0 auto;
    cursor:pointer;
  }
  .cb-label{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.58rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .checkbox{
    flex:0 0 20px;
    width:20px;
    height:20px;
    border:1.5px solid var(--ink);
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .15s ease;
  }
  .checkbox.checked{
    background:var(--accent);
    border-color:var(--accent);
  }
  .checkbox.avail-checked{
    background:var(--gold);
    border-color:var(--gold);
  }
  .checkbox svg{
    width:12px;
    height:12px;
    opacity:0;
    transition:opacity .15s ease;
  }
  .checkbox.checked svg{opacity:1;}
  .item-body{flex:1;min-width:0;}
  .item-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:baseline;
  }
  .item-name{
    font-size:0.98rem;
    line-height:1.3;
  }
  .item.done .item-name{
    color:var(--done);
    text-decoration:line-through;
  }
  .item-qty{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.72rem;
    color:var(--gold);
    white-space:nowrap;
    flex:0 0 auto;
  }
  .item.done .item-qty{color:var(--done);}
  .item-note{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.76rem;
    color:var(--muted);
    margin-top:2px;
    line-height:1.3;
  }
  .item-buy{
    display:inline-block;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.65rem;
    letter-spacing:0.05em;
    padding:1px 6px;
    border-radius:8px;
    margin-right:6px;
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:600;
  }
  .item-buy.us{
    background:#f2e6d6;
    color:var(--gold);
  }
  .item-buy.unavail{
    background:#f5dcd9;
    color:#a13d34;
  }
  footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:12px 16px;
    display:flex;
    justify-content:center;
    gap:8px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    flex-wrap:wrap;
  }
  footer button{
    font-size:0.72rem;
    padding:8px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  footer button.on{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  footer button:active{background:var(--accent-soft);}
  .empty-note{
    text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--muted);
    font-size:0.8rem;
    padding:20px 0;
  }
</style>

// Replace this with the config object from your Firebase project
// (Project settings -> General -> Your apps -> SDK setup and configuration)
const firebaseConfig = {
    apiKey: "AIzaSyDDfBm8NIu-riVFkkkp8vv3k93QeX4K6fg",
    authDomain: "f1-packing.firebaseapp.com",
    databaseURL: "https://f1-packing-default-rtdb.firebaseio.com",
    projectId: "f1-packing",
    storageBucket: "f1-packing.firebasestorage.app",
    messagingSenderId: "550475930374",
    appId: "1:550475930374:web:b63c0e496eaf25a4d31c87"

// ==============================

// A fixed document path all your devices read/write to.
// Change this string to anything private-ish if you want a bit of obscurity.
const DOC_PATH = "packingLists/f1-checklist-harsha";

let db = null;
let docRef = null;
let firebaseReady = false;

const STORAGE_KEY = "f1-packing-checked-v2";
let checked = {}; // checked[id] = { available: bool, packed: bool }
let activeCat = "All";
let showUnpackedOnly = false;
let showUnavailOnly = false;

function getState(id){
  return checked[id] || { available: false, packed: false };
}
function setState(id, patch){
  const cur = getState(id);
  checked[id] = Object.assign({}, cur, patch);
}

function setSyncStatus(state, text){
  const dot = document.getElementById("syncDot");
  const label = document.getElementById("syncText");
  dot.className = "sync-dot" + (state ? " " + state : "");
  label.textContent = text;
}

async function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInAnonymously();
    db = firebase.firestore();
    docRef = db.collection(DOC_PATH.split("/")[0]).doc(DOC_PATH.split("/")[1]);
    firebaseReady = true;

    // Live sync: any device's change reflects here automatically
    docRef.onSnapshot(snap=>{
      if(snap.exists){
        const data = snap.data();
        checked = data.checked || {};
        render();
      }
      setSyncStatus("ok", "Synced");
    }, err=>{
      console.error(err);
      setSyncStatus("err", "Sync error - using local copy");
    });
  }catch(e){
    console.error("Firebase init failed", e);
    setSyncStatus("err", "Offline - saving on this device only");
    firebaseReady = false;
  }
}

function itemId(cat, name){
  return (cat + "::" + name).replace(/\s+/g,"_");
}

function totalCount(){
  return DATA.reduce((s,c)=>s+c.items.length,0);
}
function packedCount(){
  return Object.values(checked).filter(v=>v && v.packed).length;
}

function loadLocalFallback(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) checked = JSON.parse(raw);
  }catch(e){ checked = {}; }
}

async function saveState(){
  // Always keep a local copy so the page still works offline
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(checked)); }catch(e){}

  if(firebaseReady && docRef){
    try{
      await docRef.set({ checked: checked, updatedAt: Date.now() }, { merge: false });
    }catch(e){
      console.error("Cloud save failed", e);
      setSyncStatus("err", "Save failed - retry when online");
    }
  }
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const cats = ["All", ...DATA.map(c=>c.cat)];
  tabs.innerHTML = "";
  cats.forEach(cat=>{
    const btn = document.createElement("div");
    btn.className = "tab" + (cat===activeCat ? " active" : "");
    btn.textContent = cat;
    btn.onclick = ()=>{ activeCat = cat; render(); };
    tabs.appendChild(btn);
  });
}

function render(){
  renderTabs();
  const main = document.getElementById("main");
  main.innerHTML = "";
  const catsToShow = activeCat === "All" ? DATA : DATA.filter(c=>c.cat===activeCat);
  let anyRendered = false;

  catsToShow.forEach(cat=>{
    const visibleItems = cat.items.filter(it=>{
      const id = itemId(cat.cat, it[0]);
      const st = getState(id);
      if(showUnpackedOnly && st.packed) return false;
      if(showUnavailOnly && st.available) return false;
      return true;
    });
    if(visibleItems.length === 0) return;
    anyRendered = true;

    const section = document.createElement("div");
    section.className = "section";

    const catDoneCount = cat.items.filter(it=>getState(itemId(cat.cat,it[0])).packed).length;

    const title = document.createElement("div");
    title.className = "section-title";
    title.innerHTML = `<h2>${cat.cat}</h2><span class="section-count">${catDoneCount}/${cat.items.length}</span>`;
    section.appendChild(title);

    visibleItems.forEach(it=>{
      const [name, qty, place, note] = it;
      const id = itemId(cat.cat, name);
      const st = getState(id);
      const isPacked = !!st.packed;
      const isAvail = !!st.available;

      const row = document.createElement("div");
      row.className = "item" + (isPacked ? " done" : "");

      const availUnit = document.createElement("div");
      availUnit.className = "cb-unit";
      const availCb = document.createElement("div");
      availCb.className = "checkbox" + (isAvail ? " avail-checked" : "");
      availCb.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      const availLabel = document.createElement("span");
      availLabel.className = "cb-label";
      availLabel.textContent = "Have";
      availUnit.appendChild(availCb);
      availUnit.appendChild(availLabel);
      availUnit.onclick = (e)=>{
        e.stopPropagation();
        setState(id, { available: !isAvail });
        saveState();
        render();
      };

      const packUnit = document.createElement("div");
      packUnit.className = "cb-unit";
      const packCb = document.createElement("div");
      packCb.className = "checkbox" + (isPacked ? " checked" : "");
      packCb.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      const packLabel = document.createElement("span");
      packLabel.className = "cb-label";
      packLabel.textContent = "Packed";
      packUnit.appendChild(packCb);
      packUnit.appendChild(packLabel);
      packUnit.onclick = (e)=>{
        e.stopPropagation();
        setState(id, { packed: !isPacked });
        saveState();
        render();
      };

      const body = document.createElement("div");
      body.className = "item-body";
      const buyBadge = place === "US" ? `<span class="item-buy us">BUY IN US</span>` : `<span class="item-buy">PACK FROM IN</span>`;
      const unavailBadge = !isAvail ? `<span class="item-buy unavail">NOT YET HAVE</span>` : "";
      body.innerHTML = `
        <div class="item-row">
          <span class="item-name">${name}</span>
          <span class="item-qty">${qty}</span>
        </div>
        <div class="item-note">${buyBadge}${unavailBadge}${note ? note : ""}</div>
      `;

      row.appendChild(availUnit);
      row.appendChild(body);
      row.appendChild(packUnit);
      section.appendChild(row);
    });

    main.appendChild(section);
  });

  if(!anyRendered){
    const empty = document.createElement("div");
    empty.className = "empty-note";
    empty.textContent = "Nothing matches this filter. Nice work.";
    main.appendChild(empty);
  }

  const total = totalCount();
  const done = packedCount();
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${done} / ${total} packed`;
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("subtitle").textContent = "For your F1 travel \u2014 mark what you have, then what's packed";
  document.getElementById("unpackedOnlyBtn").classList.toggle("on", showUnpackedOnly);
  document.getElementById("unavailOnlyBtn").classList.toggle("on", showUnavailOnly);
}

document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("Reset all checked items?")){
    checked = {};
    saveState();
    render();
  }
};
document.getElementById("unpackedOnlyBtn").onclick = ()=>{
  showUnpackedOnly = !showUnpackedOnly;
  render();
};
document.getElementById("unavailOnlyBtn").onclick = ()=>{
  showUnavailOnly = !showUnavailOnly;
  render();
};

(async function init(){
  loadLocalFallback();
  render();
  await initFirebase();
})();
</script>

</body>
</html>
